# mini-SWE-agent 2.4.6 configuration for ontology alignment (keys checked against the package's default.yaml).
# The model is the trained E4B served by vLLM (or Ollama after GGUF export) through LiteLLM's text-based class,
# which extracts actions with the same ```mswea_bash_command``` regex the reward parser uses.
agent:
  # system_template: set at run time to harness.prompts.AGENT_SYSTEM, the exact prompt of the decision_agent
  # training rows (eval/agent_eval.py); a separate copy here had drifted from what the model was trained on.
  system_template: "{{ placeholder }}"
  instance_template: |
    {{task}}
  step_limit: 6
  cost_limit: 0.
  max_consecutive_format_errors: 2
environment:
  environment_class: docker
  image: oa-rlaif-om:latest
  cwd: /task
  timeout: 30
  env:
    PAGER: cat
    OM_TASK: /task/episode.json
model:
  model_class: litellm_textbased
  model_name: hosted_vllm/oa-rlaif-e4b
  model_kwargs:
    api_base: http://localhost:8000/v1
    temperature: 0.0
    max_tokens: 512
  cost_tracking: ignore_errors
  observation_template: |
    <returncode>{{output.returncode}}</returncode>
    <output>
    {{ output.output -}}
    </output>
  format_error_template: |
    Format error: {{ error }}. Reply with a THOUGHT line and exactly one ```mswea_bash_command``` block.
