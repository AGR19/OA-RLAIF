# Documented, reviewed deviations accepted by data/verify.py. Each entry needs a reason; nothing is accepted silently.
# ontologies: {<path relative to raw folder>: "<reason>"}   (class-count mismatch or OWL API load failure)
# references: {<path relative to raw folder>: "<reason>"}   (status "fail")
# empty_files: {<path relative to raw folder>: "<reason>"}  (data-bearing files that contain only a header in the source)
# Reference files are never edited. Cells that cannot be used are excluded and counted, and the counts are reported.
ontologies:
  "external/cyber/uco.owl": >-
    OWL punning in the source: hasConfidenceValue, hasMACAddress and hasSource are declared both as
    ObjectProperty and DatatypeProperty. The OWL API counts them in both sets (58 + 45 = 103); our parser keeps one
    entity per IRI (100). Classes agree exactly (106 = 106); ELK: consistent.
  "ICD-10 to SNOWMEDCT/snomed-ct-us-20260901.owl": >-
    OWL 2 punning. snomed:762705008 (Concept model object attribute) and snomed:762706009 (Concept model data
    attribute) are declared both as Class and as ObjectProperty/DataProperty. The OWL API counts them as classes
    (390,669). Our parser keeps one entity per IRI and types them as properties (390,667 classes). Property
    counts agree (143 = 143); label assertions differ by the same 2 entities. ELK: consistent, 0 unsatisfiable.
references:
  "biodiv/flopo-pto.rdf": >-
    Reference defects, reported and not edited. 1 cell has a target without a namespace ("PATO_0000103"); 14
    cells name source classes that are absent from the supplied FLOPO file (6.1%); 1 duplicate cell. These cells
    do not resolve to declared classes and the episode builder excludes them from the reference alignment.
  "complex-OM-benchmark-main/hydrography/cree-swo/reference.rdf": >-
    7 cells use the relation "//" (XML &#47;&#47;). The benchmark README does not define it and it is not an
    Alignment API relation. These cells are excluded from training and evaluation (complex.EXCLUDED_RELATIONS);
    all other cells are used.
  "complex-OM-benchmark-main/hydrography/hydrOntology_native-swo/reference.rdf": >-
    Cells with the undefined relation "//" are excluded, as for cree-swo; 3 cells name source classes that are
    absent from the supplied ontology. All other cells are used.
  "complex-OM-benchmark-main/hydrography/hydrOntology_translated-swo/reference.rdf": >-
    Cells with the undefined relation "//" are excluded, as for cree-swo; 3 cells name source classes that are
    absent from the supplied ontology. All other cells are used.
